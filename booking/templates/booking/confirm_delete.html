{% extends "base.html" %}

{% block content %}
<div class="delete-container">
    <div class="delete-content">
        <h1>Confirm Delete</h1>
        <p class="alert-danger">Are you sure you want to delete the appointment on {{ appointment.date }} at {{ appointment.time|default:"Not Available" }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'patients_page' %}" class="btn btn-primary">No, go back</a>
        </form>
    </div>
</div>

{% endblock content %}
